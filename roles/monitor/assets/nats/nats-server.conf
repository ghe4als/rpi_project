# NATS server config for the monitor Pi.
# Rendered as-is by install.sh (no envsubst needed - listening on all
# interfaces, JetStream storage under /var/lib/nats/jetstream, HTTP
# monitoring on :8222). No auth (trusted LAN).

listen: 0.0.0.0:4222
http_port: 8222
jetstream {
  store_dir: /var/lib/nats/jetstream
  max_memory_store: 0
  max_file_store: 1073741824
}