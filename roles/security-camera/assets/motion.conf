# Minimal Motion config for a USB UVC webcam on Raspberry Pi OS Trixie.
# Reference: /usr/share/doc/motion/examples/motion-dist.conf.gz
# daemon=off keeps motion in the foreground so systemd's Type=simple unit
# tracks the real PID. With daemon=on, motion forks and the parent exits
# cleanly, making systemd think the service stopped successfully.
daemon off
log_file /var/log/motion/motion.log
log_level 5

# --- Capture device ---
videodevice /dev/video0
width 1280
height 720
framerate 15

# --- Detection ---
# Tuned for small subjects (baby chicks in a brooder, top-down view).
# Default threshold=1500 is sized for human-scale intruders; chick
# movement on a 1280x720 frame typically touches only 200-400 pixels,
# so the default would silently miss every event.
# despeckle_filter + noise_level pin the sensor noise floor under
# warm/red heat-lamp lighting, which otherwise causes a low threshold
# to fire constantly on hot-pixel shimmer.
# smart_mask_speed lets motion auto-mask stationary parts of the scene
# (pen walls, feeder, waterer) so only the moving chicks count.
threshold 400
noise_level 64
despeckle_filter EedDl
smart_mask_speed 5
event_gap 10
minimum_motion_frames 2
pre_capture 2
post_capture 5

# --- Output ---
target_dir /var/lib/motion
# picture_output=center picks the middle frame of each motion event burst
# (chicken-cam install.sh enforces this). 'best' would pick the frame with
# the most pixel change, which on active subjects in dim light is also the
# MOST motion-blurred frame — bad for downstream vision-model classification.
picture_output center
movie_output on
movie_max_time 600
movie_quality 75
movie_codec mkv

# --- Streaming / web control ---
stream_port 8081
stream_localhost off
stream_maxrate 15
stream_quality 60

webcontrol_port 8080
webcontrol_localhost on
webcontrol_parms 0
