<!DOCTYPE html>
<!--
  Travel-router setup page (H02). Served by status-server.py at /setup from
  this file's installed location. Mobile-first, zero external requests (the
  device may be offline by design), vanilla JS.

  RENDERING RULE (greppable, enforced by validate-local.sh): this page builds
  DOM exclusively with createElement + textContent. innerHTML /
  insertAdjacentHTML / document.write are FORBIDDEN — SSIDs and error text
  come from outside (hotel networks are hostile input).

  SCAN ROW FORMAT (nmcli terse, colon-separated): SSID:SIGNAL:SECURITY where
  nmcli escapes ':' as '\:' and '\' as '\\'. SECURITY is a space-joined
  subset of WEP|WPA1|WPA2|WPA3|OWE|OWE-TM|802.1X; an EMPTY security string
  means an open network. The escape-aware SSID splitter below decodes raw
  rows into [ssid, signal, security]; its semantics are pinned by a python
  replica in validate-local.sh §5r — keep both in lockstep.

  KNOWN NETWORKS feed: GET /api/wan/known -> {known:[{name,timestamp,
  autoconnect}]}. Scan cards for SSIDs also present in the known list get a
  "known" badge. Hidden networks (empty ssid) and enterprise networks
  (security contains 802.1X) render as NON-CONNECTABLE cards. The RAW
  (unescaped) SSID is carried in element.dataset for API calls and is NEVER
  re-derived from the rendered label text.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Router Setup</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem;
         background: #101418; color: #e8eaed; }
  main { max-width: 30rem; margin: 0 auto; }
  h1 { font-size: 1.25rem; }
  section { background: #1a2027; border-radius: 10px; padding: 0.9rem;
            margin-bottom: 0.9rem; }
  h2 { font-size: 1rem; margin: 0 0 0.5rem; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 2px 8px 2px 0; }
  .label { font-weight: 600; }
  input, button { font-size: 1rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.5rem; margin: 0.3rem 0;
          border-radius: 6px; border: 1px solid #3a434e; background: #101418;
          color: #e8eaed; }
  button { padding: 0.55rem 1rem; margin: 0.3rem 0.3rem 0.3rem 0;
           border-radius: 8px; border: 0; background: #2d7ff9; color: white;
           font-weight: 600; }
  button.secondary { background: #3a434e; }
  button:disabled { opacity: 0.5; }
  .msg { min-height: 1.2em; font-size: 0.9rem; color: #9aa5b1; }
  .warn { color: #ffb84d; }
  .ok { color: #5dd879; }

  /* per-network card */
  .netcard { background: #222a33; border-radius: 8px; padding: 0.7rem 0.8rem;
             margin: 0.4rem 0; }
  .netcard .ssid { font-weight: 700; font-size: 1.02rem; word-break: break-all; }
  .netcard .meta { font-size: 0.85rem; color: #9aa5b1; margin-top: 0.25rem;
                   display: flex; align-items: center; flex-wrap: wrap;
                   gap: 0.4rem 0.6rem; }
  .sig { display: inline-flex; gap: 2px; margin-left: 0.25rem; vertical-align: middle; }
  .sig i { display: inline-block; width: 4px; height: 12px; background: #3a434e;
           border-radius: 1px; }
  .sig i.on { background: #5dd879; }
  .badge { display: inline-block; font-size: 0.72rem; padding: 1px 6px;
           border-radius: 999px; background: #2d7ff9; color: white;
           font-weight: 600; letter-spacing: 0.02em; }
  .badge.open { background: #3a434e; color: #e8eaed; }
  .badge.ent  { background: #7a3e3e; color: #ffd6d6; }
  .badge.known{ background: #2d7ff9; }
  .badge.auto { background: #2d6f4d; color: #d6ffe6; }
  .netcard .cardbtns { margin-top: 0.5rem; display: flex; flex-wrap: wrap;
                       gap: 0.35rem; }
  .netcard .pskwrap { margin-top: 0.5rem; }
  .netcard .pskwrap input { margin: 0.2rem 0; }
  .netcard .cardmsg { min-height: 1.1em; font-size: 0.82rem; color: #9aa5b1;
                      margin-top: 0.35rem; word-break: break-all; }
  .netcard .cardmsg.warn { color: #ffb84d; }
  .netcard .cardmsg.ok { color: #5dd879; }
  .dim { color: #6b7682; font-style: italic; }

  /* setup-v2 M6: scrollable top-10 scan table */
  #scan-table-wrap { max-height: 21rem; overflow-y: auto; }
  #scan-table { width: 100%; }
  #scan-table td { padding: 4px 6px 4px 0; border-bottom: 1px solid #222a33;
                   font-size: 0.9rem; }
  #scan-table .net-ssid { font-weight: 600; word-break: break-all; }
  #scan-table button { font-size: 0.85rem; padding: 0.35rem 0.7rem;
                       margin: 0; }

  /* setup-v2 M7: native dialog (connect + try saved passwords) */
  dialog { border: 1px solid #3a434e; border-radius: 10px; background: #1a2027;
           color: #e8eaed; padding: 1rem; max-width: 26rem; width: 92%; }
  dialog::backdrop { background: rgba(4, 8, 12, 0.7); }
  .drow { margin: 0.4rem 0; }
  .dmsg { min-height: 1.2em; font-size: 0.85rem; color: #9aa5b1;
          word-break: break-all; }
  .dmsg.warn { color: #ffb84d; }
  .dmsg.ok { color: #5dd879; }
</style>
</head>
<body>
<main>
  <h1>Travel Router Setup</h1>

  <section>
    <h2>Status</h2>
    <table><tbody id="status-rows"></tbody></table>
    <p class="msg" id="status-msg"></p>
  </section>

  <section>
    <h2>PIN</h2>
    <label for="pin">Setup PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="off">
    <p class="msg" id="pin-msg"></p>
  </section>

  <section>
    <h2>Networks</h2>
    <button id="scan-btn" type="button">Scan</button>
    <div id="scan-table-wrap"><div id="scan-list"></div></div>
    <p class="msg" id="scan-msg"></p>
  </section>

  <section>
    <h2>Known networks</h2>
    <div id="known-list"></div>
    <p class="msg" id="known-msg"></p>
  </section>

  <section>
    <h2>Connect manually</h2>
    <label for="ssid">Network name (SSID)</label>
    <input id="ssid" autocomplete="off" maxlength="32">
    <label for="psk">Password (leave empty for open networks)</label>
    <input id="psk" type="password" autocomplete="off">
    <p>
      <button id="connect-btn" type="button">Connect</button>
      <button id="disconnect-btn" type="button" class="secondary">Disconnect</button>
      <button id="forget-btn" type="button" class="secondary">Forget</button>
    </p>
    <p class="msg" id="form-msg"></p>
  </section>

  <section>
    <h2>Saved passwords</h2>
    <p class="msg" id="pskmanage-msg"></p>
    <div id="pskmanage-list"></div>
    <label for="pm-psk">Add a default password (tried for any network)</label>
    <input id="pm-psk" type="password" autocomplete="off">
    <p>
      <button id="pm-add" type="button">Add default password</button>
      <button id="pm-refresh" type="button" class="secondary">Refresh list</button>
      <button id="ap-open" type="button" class="secondary">AP settings</button>
    </p>
  </section>
</main>

<dialog id="net-dialog">
  <h2 id="d-title">Connect</h2>
  <div class="drow"><span class="label">Network:</span> <span id="d-ssid"></span></div>
  <label for="d-psk">Password (leave empty for open networks)</label>
  <input id="d-psk" type="password" autocomplete="off">
  <p>
    <button id="d-connect" type="button">Connect</button>
    <button id="d-try" type="button" class="secondary">Try saved passwords</button>
    <button id="d-cancel" type="button" class="secondary">Cancel</button>
  </p>
  <p class="dmsg" id="d-msg"></p>
</dialog>

<dialog id="ap-dialog">
  <h2>AP settings</h2>
  <div class="drow"><span class="label">Current:</span> <span id="ap-current"></span></div>
  <label for="ap-ssid">New network name (SSID, optional)</label>
  <input id="ap-ssid" autocomplete="off" maxlength="32">
  <label for="ap-psk">New password (8-63 chars, optional)</label>
  <input id="ap-psk" type="password" autocomplete="off">
  <p>
    <button id="ap-save" type="button">Save &amp; restart AP</button>
    <button id="ap-cancel" type="button" class="secondary">Cancel</button>
  </p>
  <p class="dmsg" id="ap-msg"></p>
</dialog>

<script>
"use strict";
// DOM built with createElement/textContent only (see file-header rule).
// The RAW (unescaped) SSID is carried in element.dataset.ssid for API calls
// and is NEVER re-derived from rendered label text.

function cellRow(tbody, label, value) {
  var tr = document.createElement("tr");
  var l = document.createElement("td");
  l.className = "label";
  l.textContent = label;
  var v = document.createElement("td");
  v.textContent = value;
  tr.appendChild(l); tr.appendChild(v);
  tbody.appendChild(tr);
}

function setMsg(id, text, cls) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg" + (cls ? " " + cls : "");
}

function api(path, body) {
  var opts = {
    method: "POST",
    cache: "no-store",
    headers: { "Content-Type": "application/json",
               "X-Requested-With": "XMLHttpRequest" },
    body: JSON.stringify(body || {})
  };
  return fetch(path, opts);
}

function pinOrNull() {
  var pin = document.getElementById("pin").value.trim();
  if (pin) { try { localStorage.setItem("setup-pin", pin); } catch (e) {} }
  return pin;
}

function savedPin() {
  try { return localStorage.getItem("setup-pin") || ""; } catch (e) { return ""; }
}

// --- escape-aware SSID splitter ------------------------------------------
// Contract pinned by a python replica in validate-local.sh §5r. Single pass
// over the raw scan row: backslash escapes the next char (any char); an
// unescaped ':' emits a field separator. Returns the first 3 fields
// [ssid, signal, security]. A trailing lone backslash (no next char) is
// emitted literally. Empty ssid => hidden network; empty security => open.
function splitRow(row) {
  var out = []; var cur = ""; var i = 0;
  while (i < row.length) {
    var ch = row.charAt(i);
    if (ch === "\\" && i + 1 < row.length) {
      cur += row.charAt(i + 1); i += 2; continue;
    }
    if (ch === ":") { out.push(cur); cur = ""; }
    else { cur += ch; }
    i += 1;
  }
  out.push(cur);
  return out.slice(0, 3);
}

// --- signal bar (0..100 -> 4 segments) -----------------------------------
function signalBars(sig) {
  var n = Math.max(0, Math.min(4, Math.round((Number(sig) || 0) / 25)));
  var wrap = document.createElement("span");
  wrap.className = "sig";
  wrap.setAttribute("aria-label", String(sig));
  for (var k = 0; k < 4; k++) {
    var b = document.createElement("i");
    if (k < n) { b.className = "on"; }
    wrap.appendChild(b);
  }
  return wrap;
}

function badge(text, cls) {
  var b = document.createElement("span");
  b.className = "badge" + (cls ? " " + cls : "");
  b.textContent = text;
  return b;
}

// security label for a parsed security token string
function securityLabel(sec) {
  if (!sec) { return "Open"; }
  if (sec.indexOf("802.1X") !== -1) { return "Enterprise (unsupported)"; }
  return sec;
}

var LAST_STATUS = null;
function refreshStatusLast() { return LAST_STATUS; }
function refreshStatus() {
  fetch("/status", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (d) {
      LAST_STATUS = d;
      var tbody = document.getElementById("status-rows");
      while (tbody.firstChild) { tbody.removeChild(tbody.firstChild); }
      cellRow(tbody, "Mode", d.mode || "?");
      if (d.wan_ssid) { cellRow(tbody, "Hotel SSID", d.wan_ssid); }
      if (d.wan_ip) { cellRow(tbody, "WAN IP", d.wan_ip); }
      var msg = document.getElementById("status-msg");
      if (d.internet === "yes") {
        cellRow(tbody, "Internet", "yes");
        msg.textContent = "Online through " + (d.wan_ssid || d.wan_if);
        msg.className = "msg ok";
      } else if (d.internet === "reachable") {
        msg.textContent = "Connected to " + (d.wan_ssid || "network") +
          " — open any http:// site (or wait) to finish the network's own " +
          "login page from this device.";
        msg.className = "msg warn";
      } else {
        msg.textContent = "No internet yet — scan and connect below.";
        msg.className = "msg";
      }
    })
    .catch(function () {
      document.getElementById("status-msg").textContent = "status unavailable";
    });
}

var KNOWN_NAMES = {};   // ssid -> true, refreshed alongside scan
var SCAN_BUSY = false;
var GLOBAL_BUSY = { scan: false, connect: false };

function busy(on) {
  ["scan-btn", "connect-btn", "disconnect-btn", "forget-btn"].forEach(
    function (id) { document.getElementById(id).disabled = on; });
}

function handleErr(prefix) {
  return function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (r.status === 403 && d.error === "pin") {
        throw new Error("PIN required — enter it below (ask the router owner if unknown)");
      }
      throw new Error(prefix + " (HTTP " + r.status + ")");
    });
  };
}

// card-level message helper
function setCardMsg(card, text, cls) {
  var m = card.querySelector(".cardmsg");
  if (!m) { return; }
  m.textContent = text;
  m.className = "cardmsg" + (cls ? " " + cls : "");
}

// enable/disable all buttons inside a card
function setCardBusy(card, on) {
  var btns = card.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) { btns[i].disabled = on; }
}

// render one scan row as a card; returns the card element (or null if row
// could not be parsed into 3 fields).
function renderScanCard(line, knownSet) {
  var fields = splitRow(line);
  if (fields.length < 3) { return null; }
  var ssid = fields[0];
  var sig = fields[1];
  var sec = fields[2];
  var hidden = (ssid === "");
  var enterprise = (sec.indexOf("802.1X") !== -1);
  var connectable = !hidden && !enterprise;
  var isKnown = !hidden && Object.prototype.hasOwnProperty.call(knownSet, ssid);

  var card = document.createElement("div");
  card.className = "netcard";
  card.dataset.ssid = ssid;  // RAW SSID for API calls — never re-derive from label

  var name = document.createElement("div");
  name.className = "ssid";
  name.textContent = hidden ? "(hidden network)" : ssid;
  card.appendChild(name);

  var meta = document.createElement("div");
  meta.className = "meta";
  // signal number + bars
  var sigText = document.createElement("span");
  sigText.textContent = "signal " + (sig || "?");
  meta.appendChild(sigText);
  meta.appendChild(signalBars(sig));
  // security badge
  var secBadge = badge(securityLabel(sec),
    !sec ? "open" : (enterprise ? "ent" : ""));
  meta.appendChild(secBadge);
  // known badge (cross-reference)
  if (isKnown) { meta.appendChild(badge("known", "known")); }
  card.appendChild(meta);

  if (!connectable) {
    var note = document.createElement("div");
    note.className = "cardmsg dim";
    note.textContent = hidden
      ? "Hidden network — connect manually with the SSID."
      : "Enterprise (unsupported) — 802.1X networks cannot be joined from this page.";
    card.appendChild(note);
    return card;
  }

  // action buttons
  var btns = document.createElement("div");
  btns.className = "cardbtns";

  var connectBtn = document.createElement("button");
  connectBtn.type = "button";
  connectBtn.textContent = "Connect";
  btns.appendChild(connectBtn);

  var tryBtn = document.createElement("button");
  tryBtn.type = "button";
  tryBtn.className = "secondary";
  tryBtn.textContent = "Try saved passwords";
  btns.appendChild(tryBtn);

  card.appendChild(btns);

  // inline PSK input (revealed by Connect)
  var pskWrap = document.createElement("div");
  pskWrap.className = "pskwrap";
  pskWrap.style.display = "none";

  var pskLabel = document.createElement("label");
  pskLabel.textContent = "Password (leave empty for open)";
  pskLabel.style.fontSize = "0.85rem";
  var pskInput = document.createElement("input");
  pskInput.type = "password";
  pskInput.autocomplete = "off";
  pskWrap.appendChild(pskLabel);
  pskWrap.appendChild(pskInput);

  var goBtn = document.createElement("button");
  goBtn.type = "button";
  goBtn.textContent = "Connect";
  pskWrap.appendChild(goBtn);

  card.appendChild(pskWrap);

  var cardMsg = document.createElement("div");
  cardMsg.className = "cardmsg";
  card.appendChild(cardMsg);

  // Connect on the card reveals the inline PSK input.
  connectBtn.addEventListener("click", function () {
    if (pskWrap.style.display === "none") {
      pskWrap.style.display = "block";
      pskInput.focus();
      setCardMsg(card, "enter password if needed, then Connect", "");
      return;
    }
    // already revealed: act as connect with current psk
    doConnect(card, ssid, pskInput.value);
  });

  goBtn.addEventListener("click", function () {
    doConnect(card, ssid, pskInput.value);
  });

  // Try saved passwords: POST /api/wan/psks {pin, ssid} — render envelope
  // `lines` as progress text; disable while busy.
  tryBtn.addEventListener("click", function () {
    var pin = pinOrNull() || savedPin();
    if (!pin) {
      setCardMsg(card, "PIN required — enter it in the PIN section", "warn");
      return;
    }
    setCardBusy(card, true);
    setCardMsg(card, "trying saved passwords…", "");
    api("/api/wan/psks", { pin: pin, ssid: ssid }).then(function (r) {
      if (r.status === 403) { return handleErr("psks denied")(r); }
      return r.json();
    }).then(function (d) {
      var lines = d.lines || [];
      if (lines.length) {
        setCardMsg(card, lines.join("  |  "), d.ok ? "ok" : "");
      } else {
        // setup-v2 M1: try-psks progress lives in the envelope's `log` field
        // (travel-wan logs to stderr); stdout is empty — show it instead of
        // the opaque "failed (rc=N)".
        var log = (d.log && d.log.join(" ")) || (d.ok ? "done" : "failed (rc=" + d.rc + ")");
        setCardMsg(card, log, d.ok ? "ok" : "warn");
      }
      if (d.ok) { refreshStatus(); }
    }).catch(function (e) {
      setCardMsg(card, String(e.message || e), "warn");
    }).then(function () { setCardBusy(card, false); },
            function () { setCardBusy(card, false); });
  });

  function doConnect(cardEl, rawSsid, pskVal) {
    var pin = pinOrNull() || savedPin();
    if (!pin) {
      setCardMsg(cardEl, "PIN required — enter it in the PIN section", "warn");
      return;
    }
    setCardBusy(cardEl, true);
    setCardMsg(cardEl, "connecting…", "");
    var body = { pin: pin, ssid: rawSsid };
    if (pskVal) { body.psk = pskVal; }
    api("/api/wan/connect", body).then(function (r) {
      if (r.status === 403) { return handleErr("connect denied")(r); }
      return r.json();
    }).then(function (d) {
      if (!d.ok) {
        var log = (d.log && d.log.join(" ")) || ("failed (rc=" + d.rc + ")");
        setCardMsg(cardEl, log, "warn");
      } else {
        setCardMsg(cardEl, "connected", "ok");
        refreshStatus();
        refreshKnown();
      }
    }).catch(function (e) {
      setCardMsg(cardEl, String(e.message || e), "warn");
    }).then(function () { setCardBusy(cardEl, false); },
            function () { setCardBusy(cardEl, false); });
  }

  return card;
}

function doScan() {
  busy(true);
  SCAN_BUSY = true;
  setMsg("scan-msg", "scanning…");
  // refresh known alongside scan so cards can show the "known" badge
  var knownP = fetch("/api/wan/known", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) { return d.known || []; })
    .catch(function () { return []; });
  knownP.then(renderKnown);  // also render the Known section
  // Scan is POST but the server never reads the request body. Send NO body:
  // a JSON "{}" body left unread in the keep-alive buffer poisons the next
  // request on the same connection ("{}POST /api/wan/psks ..." → 501). Same
  // X-Requested-With header as api(); only the body is omitted.
  fetch("/api/wan/scan", {
    method: "POST", cache: "no-store",
    headers: { "X-Requested-With": "XMLHttpRequest" }
  }).then(function (r) {
    if (!r.ok) { return handleErr("scan failed")(r); }
    return r.json();
  }).then(function (d) {
    var knownSet = {};
    // build the name set from the freshly fetched known list
    return knownP.then(function (known) {
      (known || []).forEach(function (k) {
        if (k && k.name) { knownSet[k.name] = true; }
      });
      var list = document.getElementById("scan-list");
      while (list.firstChild) { list.removeChild(list.firstChild); }
      var rows = (d.lines || []).slice();
      // sort by signal (field 2) descending — keep stable for ties
      rows.sort(function (a, b) {
        var sa = Number(splitRow(a)[1]) || 0;
        var sb = Number(splitRow(b)[1]) || 0;
        return sb - sa;
      });
      // setup-v2 M6: scrollable TABLE, top-10 by signal. Hidden + enterprise
      // networks stay out of the table and surface as dim notes below it.
      var table = document.createElement("table");
      table.id = "scan-table";
      var tbody = document.createElement("tbody");
      var hiddenN = 0, entN = 0, shown = 0;
      rows.forEach(function (line) {
        var fields = splitRow(line);
        if (fields.length < 3) { return; }
        var ssid = fields[0], sig = fields[1], sec = fields[2];
        var hidden = (ssid === "");
        var enterprise = (sec.indexOf("802.1X") !== -1);
        if (hidden) { hiddenN += 1; return; }
        if (enterprise) { entN += 1; return; }
        if (shown >= 10) { return; }
        shown += 1;
        var tr = document.createElement("tr");
        var tdSig = document.createElement("td");
        var sigSpan = document.createElement("span");
        sigSpan.textContent = (sig || "?");
        tdSig.appendChild(sigSpan);
        tdSig.appendChild(signalBars(sig));
        tr.appendChild(tdSig);
        var tdSsid = document.createElement("td");
        tdSsid.className = "net-ssid";
        tdSsid.textContent = ssid;  // RAW SSID (dataset below carries it too)
        tr.appendChild(tdSsid);
        var tdSec = document.createElement("td");
        tdSec.appendChild(badge(securityLabel(sec), !sec ? "open" : ""));
        if (Object.prototype.hasOwnProperty.call(knownSet, ssid)) {
          tdSec.appendChild(badge("known", "known"));
        }
        tr.appendChild(tdSec);
        var tdBtn = document.createElement("td");
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Connect";
        btn.dataset.ssid = ssid;  // RAW SSID for the dialog — never re-derived
        btn.addEventListener("click", function () {
          openNetDialog(btn.dataset.ssid);
        });
        tdBtn.appendChild(btn);
        tr.appendChild(tdBtn);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      list.appendChild(table);
      var notes = [];
      if (hiddenN) { notes.push(hiddenN + " hidden network" + (hiddenN === 1 ? "" : "s") + " present — connect manually"); }
      if (entN) { notes.push("enterprise (802.1X) network" + (entN === 1 ? "" : "s") + " cannot be joined from this page"); }
      var listWrap = document.getElementById("scan-list");
      notes.forEach(function (txt) {
        var note = document.createElement("div");
        note.className = "dim";
        note.textContent = txt;
        listWrap.appendChild(note);
      });
      if (!shown) {
        setMsg("scan-msg", "no networks found");
      } else {
        setMsg("scan-msg", shown + " network" + (shown === 1 ? "" : "s") + " (top " + shown + ")");
      }
    });
  }).catch(function (e) {
    setMsg("scan-msg", String(e.message || e), "warn");
  }).then(function () { busy(false); SCAN_BUSY = false; },
          function () { busy(false); SCAN_BUSY = false; });
}

// --- Known networks section ----------------------------------------------
function renderKnown(known) {
  KNOWN_NAMES = {};
  var list = document.getElementById("known-list");
  while (list.firstChild) { list.removeChild(list.firstChild); }
  if (!known || !known.length) {
    setMsg("known-msg", "no known networks yet");
    return;
  }
  setMsg("known-msg", "");
  known.forEach(function (k) {
    if (!k || !k.name) { return; }
    KNOWN_NAMES[k.name] = true;
    var card = document.createElement("div");
    card.className = "netcard";
    card.dataset.ssid = k.name;  // RAW SSID for API calls

    var name = document.createElement("div");
    name.className = "ssid";
    name.textContent = k.name;
    card.appendChild(name);

    var meta = document.createElement("div");
    meta.className = "meta";
    if (k.timestamp) {
      var ts = document.createElement("span");
      ts.textContent = "last: " + k.timestamp;
      meta.appendChild(ts);
    }
    if (k.autoconnect === "yes") { meta.appendChild(badge("autoconnect", "auto")); }
    card.appendChild(meta);

    var btns = document.createElement("div");
    btns.className = "cardbtns";
    var cBtn = document.createElement("button");
    cBtn.type = "button";
    cBtn.textContent = "Connect";
    var fBtn = document.createElement("button");
    fBtn.type = "button";
    fBtn.className = "secondary";
    fBtn.textContent = "Forget";
    btns.appendChild(cBtn);
    btns.appendChild(fBtn);
    card.appendChild(btns);

    var cMsg = document.createElement("div");
    cMsg.className = "cardmsg";
    card.appendChild(cMsg);

    cBtn.addEventListener("click", function () {
      // setup-v2 M7: Known-row Connect opens the same connect dialog (PSK
      // entry + Try saved passwords) instead of a blind connect.
      openNetDialog(k.name);
    });

    fBtn.addEventListener("click", function () {
      var pin = pinOrNull() || savedPin();
      if (!pin) { setCardMsg(card, "PIN required — enter it in the PIN section", "warn"); return; }
      setCardBusy(card, true);
      setCardMsg(card, "forgetting…", "");
      api("/api/wan/forget", { pin: pin, ssid: k.name }).then(function (r) {
        if (r.status === 403) { return handleErr("forget denied")(r); }
        return r.json();
      }).then(function (d) {
        if (!d.ok) {
          var log = (d.log && d.log.join(" ")) || ("failed (rc=" + d.rc + ")");
          setCardMsg(card, log, "warn");
        } else {
          setCardMsg(card, "forgotten", "ok");
          refreshKnown();
        }
      }).catch(function (e) {
        setCardMsg(card, String(e.message || e), "warn");
      }).then(function () { setCardBusy(card, false); },
              function () { setCardBusy(card, false); });
    });

    list.appendChild(card);
  });
}

function refreshKnown() {
  fetch("/api/wan/known", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) { renderKnown(d.known || []); })
    .catch(function () { setMsg("known-msg", "known networks unavailable", "warn"); });
}

// --- setup-v2 M7: connect dialog --------------------------------------------
// Native <dialog>: PSK entry + Connect + Try saved passwords. The RAW SSID
// rides in a closure variable (never re-derived from rendered text).
var DIALOG_SSID = "";
function openNetDialog(rawSsid) {
  DIALOG_SSID = rawSsid;
  document.getElementById("d-ssid").textContent = rawSsid || "(hidden network)";
  document.getElementById("d-psk").value = "";
  setMsg("d-msg", "");
  document.getElementById("net-dialog").showModal();
  document.getElementById("d-psk").focus();
}
function dMsg(text, cls) { setMsg("d-msg", text, cls); }
document.getElementById("d-cancel").addEventListener("click", function () {
  document.getElementById("net-dialog").close();
});
document.getElementById("d-connect").addEventListener("click", function () {
  var pin = pinOrNull() || savedPin();
  if (!pin) { dMsg("PIN required — enter it in the PIN section", "warn"); return; }
  var psk = document.getElementById("d-psk").value;
  busy(true); dMsg("connecting…", "");
  api("/api/wan/connect", { pin: pin, ssid: DIALOG_SSID, psk: psk }).then(function (r) {
    if (r.status === 403) { return handleErr("connect denied")(r); }
    return r.json();
  }).then(function (d) {
    if (!d.ok) {
      dMsg((d.log && d.log.join(" ")) || ("failed (rc=" + d.rc + ")"), "warn");
    } else {
      dMsg("connected", "ok");
      refreshStatus();
      refreshKnown();
      setTimeout(function () { document.getElementById("net-dialog").close(); }, 900);
    }
  }).catch(function (e) { dMsg(String(e.message || e), "warn"); });
});
document.getElementById("d-try").addEventListener("click", function () {
  var pin = pinOrNull() || savedPin();
  if (!pin) { dMsg("PIN required — enter it in the PIN section", "warn"); return; }
  dMsg("trying saved passwords…", "");
  api("/api/wan/psks", { pin: pin, ssid: DIALOG_SSID }).then(function (r) {
    if (r.status === 403) { return handleErr("psks denied")(r); }
    return r.json();
  }).then(function (d) {
    var lines = d.lines || [];
    if (lines.length) {
      dMsg(lines.join("  |  "), d.ok ? "ok" : "");
    } else {
      // setup-v2 M1: try-psks progress lives in the envelope's `log` field
      // (travel-wan logs to stderr); stdout is empty — show it instead of
      // the opaque "failed (rc=N)".
      var log = (d.log && d.log.join(" ")) || (d.ok ? "done" : "failed (rc=" + d.rc + ")");
      dMsg(log, d.ok ? "ok" : "warn");
    }
    if (d.ok) { refreshStatus(); }
  }).catch(function (e) { dMsg(String(e.message || e), "warn"); });
});

// --- setup-v2 M5: saved-passwords manager (phone surface for psks-manage) ----
// Lists the store's PSK candidates via GET /api/wan/psks-manage (X-Pin) and
// can add defaults via POST /api/wan/psks-manage {action:"add-default"}.
// PSK values never come back — only type/index/ssid.
function psksManage(action, extra) {
  var pin = pinOrNull() || savedPin();
  if (!pin) { return Promise.reject(new Error("PIN required — enter it in the PIN section")); }
  var body = extra || {};
  body.pin = pin;
  body.action = action;
  busy(true);
  setMsg("form-msg", "working…");
  return api("/api/wan/psks-manage", body).then(function (r) {
    if (r.status === 403) { return handleErr("psks-manage denied")(r); }
    return r.json();
  }).then(function (d) {
    setMsg("form-msg", "done", "ok");
    return d;
  }).catch(function (e) {
    setMsg("form-msg", String(e.message || e), "warn");
    return null;
  }).then(busy, busy);
}

// --- setup-v2 M5: saved-passwords list render + button wiring ---------------
// GET /api/wan/psks-manage (X-Pin) returns {rows:[{type,index,ssid}]} — the
// server DISCARDS the PSK column, so this UI can only show type/index/ssid.
function renderPskRows(rows) {
  var list = document.getElementById("pskmanage-list");
  while (list.firstChild) { list.removeChild(list.firstChild); }
  if (!rows || !rows.length) {
    setMsg("pskmanage-msg", "no saved passwords yet");
    return;
  }
  setMsg("pskmanage-msg", "");
  rows.forEach(function (row) {
    var item = document.createElement("div");
    item.className = "netcard";
    var label = document.createElement("div");
    label.className = "ssid";
    label.textContent = (row.type === "d" ? "default" : "network: " + (row.ssid || "?"))
      + "  (row " + row.index + ")";
    item.appendChild(label);
    var del = document.createElement("button");
    del.type = "button";
    del.className = "secondary";
    del.textContent = "Remove";
    del.addEventListener("click", function () {
      psksManage("del", { n: row.index }).then(function (d) {
        if (d) { refreshPskManage(); }
      });
    });
    item.appendChild(del);
    list.appendChild(item);
  });
}
function refreshPskManage() {
  var pin = pinOrNull() || savedPin();
  if (!pin) { setMsg("pskmanage-msg", "PIN required — enter it in the PIN section", "warn"); return; }
  fetch("/api/wan/psks-manage", { cache: "no-store", headers: { "X-Pin": pin } })
    .then(function (r) {
      if (r.status === 403) { setMsg("pskmanage-msg", "PIN required — enter it in the PIN section", "warn"); return null; }
      return r.json();
    })
    .then(function (d) { if (d) { renderPskRows(d.rows || []); } })
    .catch(function () { setMsg("pskmanage-msg", "saved passwords unavailable", "warn"); });
}
document.getElementById("pm-refresh").addEventListener("click", refreshPskManage);

// --- setup-v2 M8: AP settings dialog -----------------------------------------
// POST /api/wan/apconfig {pin, ssid?, psk?} — travel-wan ap-apply validates
// (hostapd -t), re-renders, restarts the AP, and restores the previous
// config if the restart fails. The radio drop kills this page's TCP
// connection mid-restart, so the dialog does NOT treat the HTTP response
// as proof: it shows "reconfiguring — reconnecting…" and polls /status
// every 2s for up to 30s (any /status response = the AP is back).
function apMsg(text, cls) { setMsg("ap-msg", text, cls); }
document.getElementById("ap-open").addEventListener("click", function () {
  document.getElementById("ap-current").textContent =
    (refreshStatusLast() || {}).ap_ssid || "(unknown)";
  document.getElementById("ap-ssid").value = "";
  document.getElementById("ap-psk").value = "";
  apMsg("");
  document.getElementById("ap-dialog").showModal();
});
document.getElementById("ap-cancel").addEventListener("click", function () {
  document.getElementById("ap-dialog").close();
});
document.getElementById("ap-save").addEventListener("click", function () {
  var pin = pinOrNull() || savedPin();
  if (!pin) { apMsg("PIN required — enter it in the PIN section", "warn"); return; }
  var ssidVal = document.getElementById("ap-ssid").value.trim();
  var pskVal = document.getElementById("ap-psk").value;
  var body = { pin: pin };
  if (ssidVal) { body.ssid = ssidVal; }
  if (pskVal) { body.psk = pskVal; }
  if (!body.ssid && !body.psk) {
    apMsg("enter a new SSID and/or password", "warn");
    return;
  }
  busy(true);
  apMsg("reconfiguring — reconnecting…", "");
  api("/api/wan/apconfig", body).then(function (r) {
    if (r.status === 403) { return handleErr("apconfig denied")(r); }
    if (r.status === 400) { return r.json().then(function (e) {
      apMsg("rejected: " + (e.error || "bad request"), "warn");
    }); }
    return r.json();
  }).then(function (d) {
    if (d && d.ok === false) {
      apMsg((d.log && d.log.join(" ")) || "failed", "warn");
      return;
    }
    // The response (and this page) die with the AP restart — poll instead.
    var waited = 0;
    var poll = setInterval(function () {
      waited += 2000;
      fetch("/status", { cache: "no-store" })
        .then(function (r) { return r.ok; })
        .catch(function () { return false; })
        .then(function (up) {
          if (up) {
            clearInterval(poll);
            apMsg("AP reconfigured", "ok");
            refreshStatus();
            if (ssidVal) {
              apMsg("AP reconfigured as '" + ssidVal + "' — join the new network, then reopen this page", "ok");
            }
            setTimeout(function () { document.getElementById("ap-dialog").close(); }, 2500);
          } else if (waited >= 30000) {
            clearInterval(poll);
            apMsg("no response after 30s — check the router", "warn");
          }
        });
    }, 2000);
  }).catch(function (e) { apMsg(String(e.message || e), "warn"); });
});

document.getElementById("pm-add").addEventListener("click", function () {
  var psk = document.getElementById("pm-psk").value;
  if (!psk) { setMsg("pskmanage-msg", "enter a password to add", "warn"); return; }
  psksManage("add-default", { psk: psk }).then(function (d) {
    if (d) { document.getElementById("pm-psk").value = ""; refreshPskManage(); }
  });
});

function apiWrite(path, extra) {
  var body = extra || {};
  var pin = pinOrNull() || savedPin();
  if (pin) { body.pin = pin; }
  busy(true);
  setMsg("form-msg", "working…");
  return api(path, body).then(function (r) {
    if (r.status === 403) { return handleErr("access denied")(r); }
    return r.json().then(function (d) {
      if (!d.ok) { throw new Error((d.log && d.log.join(" ")) || "failed (rc=" + d.rc + ")"); }
      setMsg("form-msg", "done", "ok");
      refreshStatus();
      refreshKnown();
      return d;
    });
  }).catch(function (e) {
    setMsg("form-msg", String(e.message || e), "warn");
  }).then(busy, busy);
}

function connectSsid(ssid) {
  var psk = document.getElementById("psk").value;
  var body = { ssid: ssid };
  if (psk) { body.psk = psk; }
  apiWrite("/api/wan/connect", body);
}

document.getElementById("scan-btn").addEventListener("click", doScan);
document.getElementById("connect-btn").addEventListener("click", function () {
  var ssid = document.getElementById("ssid").value.trim();
  if (!ssid) { setMsg("form-msg", "enter a network name", "warn"); return; }
  connectSsid(ssid);
});
document.getElementById("disconnect-btn").addEventListener("click", function () {
  apiWrite("/api/wan/disconnect", {});
});
document.getElementById("forget-btn").addEventListener("click", function () {
  var ssid = document.getElementById("ssid").value.trim();
  if (!ssid) { setMsg("form-msg", "enter the network name to forget", "warn"); return; }
  apiWrite("/api/wan/forget", { ssid: ssid });
});

(function initPin() {
  var saved = savedPin();
  if (saved) { document.getElementById("pin").value = saved; }
})();

refreshStatus();
refreshKnown();
setInterval(refreshStatus, 4000);
</script>
</body>
</html>
